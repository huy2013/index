<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CodeTHCS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: dark-first study console for Tin hoc 8. Hero pairs real Scratch blocks with an AI tutor bubble; lessons reveal hints one by one; the AI page is a chat with a blocks reference beside it. Boldness lives in the Scratch block drawings, everything else stays quiet. */
:root{
  --bg:#0A0F1F; --surface:#121A33; --surface2:#19234A; --line:#26335F;
  --fg:#E8ECFF; --muted:#9AA6D1;
  --violet:#7C5CFF; --cyan:#22D3EE; --amber:#FFB547; --green:#2ED47A; --red:#FF6B86;
  --on-accent:#FFFFFF;
  --f-display:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:14px; --r-sm:9px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F6FF; --surface:#FFFFFF; --surface2:#EBEEFF; --line:#D5DAF5;
    --fg:#12183A; --muted:#55608F;
    --violet:#5B3DF5; --cyan:#0A7C99; --amber:#B25E00; --green:#12803F; --red:#C7254A;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F6FF; --surface:#FFFFFF; --surface2:#EBEEFF; --line:#D5DAF5;
  --fg:#12183A; --muted:#55608F;
  --violet:#5B3DF5; --cyan:#0A7C99; --amber:#B25E00; --green:#12803F; --red:#C7254A;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--f-body);min-height:100%;margin:0;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:clamp(2.1rem,5.6vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.55rem,3.4vw,2.1rem)}
h3{font-size:1.2rem}
p{margin:0}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px;top:8px;background:var(--violet);color:var(--on-accent);padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:16px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:64px;padding-block:8px;position:relative}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;font:800 1.35rem var(--f-display);color:var(--fg);padding:0}
.logo b{color:var(--cyan);font-weight:800}
.nav{display:flex;gap:4px;margin-left:12px}
.nav button{white-space:nowrap;background:none;border:0;cursor:pointer;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500}
.nav button:hover{color:var(--fg);background:var(--surface)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--surface2)}
.actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.burger{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 18px;border-radius:999px;font-weight:600;cursor:pointer;min-height:44px;transition:transform .15s,border-color .15s,background .15s}
.btn:hover{border-color:var(--cyan);transform:translateY(-1px)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 14px;font-size:.9rem}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,var(--line))}
.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.iconbtn{width:44px;padding:0}
.ico{flex:none}

/* sections */
main{display:block;padding-block:0 56px;outline:none}
section.band{padding-block:52px}
.eyebrow{font:500 .8rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.lead{color:var(--muted);font-size:1.1rem;max-width:60ch}
.head{display:flex;flex-direction:column;gap:8px;margin-bottom:26px}

/* scratch workspace */
.ws{background:#F9F9F9 radial-gradient(#D9DBE3 1px,transparent 1.3px) 0 0/16px 16px;border:1px solid #D9D9D9;border-radius:var(--r);padding:14px;overflow-x:auto;color-scheme:light;min-width:0;max-width:100%}
.ws .sbsvg{display:block;max-width:none;height:auto}
.ws.mini{padding:8px 10px;border-radius:10px}
.sb-fallback{margin:0;font:400 .9rem/1.6 var(--f-mono);color:#575E75;white-space:pre-wrap}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:
  radial-gradient(60% 80% at 85% 20%,color-mix(in srgb,var(--violet) 26%,transparent),transparent 70%),
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/48px 48px,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 48px,var(--bg)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--bg));pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding-block:52px 64px}
.hero-copy{display:flex;flex-direction:column;gap:20px;min-width:0}
.hero-copy h1 em{font-style:normal;color:var(--cyan)}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;color:var(--muted);font:500 .9rem var(--f-mono)}
.facts b{color:var(--fg)}
.scene{position:relative;min-width:0;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:88%;padding:10px 14px;border-radius:16px;font-size:.95rem;line-height:1.5}
.bubble.q{align-self:flex-end;background:var(--violet);color:var(--on-accent);border-bottom-right-radius:4px}
.bubble.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble.a b{color:var(--cyan)}

/* cards & grids */
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.feat{display:flex;flex-direction:column;gap:8px}
.feat .ico{color:var(--cyan)}
.feat p{color:var(--muted)}
.topic{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;color:var(--fg);transition:transform .18s,border-color .18s,box-shadow .18s;--tc:var(--cyan)}
.topic:hover{transform:translateY(-4px);border-color:var(--tc);box-shadow:0 14px 30px -18px var(--tc)}
.topic .badge{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 18%,var(--surface2));color:var(--tc)}
.topic p{color:var(--muted);font-size:.95rem}
.topic .meta{font:500 .78rem var(--f-mono);color:var(--muted);margin-top:auto}
.t-1{--tc:var(--cyan)} .t-2{--tc:var(--violet)} .t-3{--tc:var(--amber)} .t-4{--tc:var(--green)} .t-5{--tc:var(--amber)} .t-6{--tc:var(--cyan)}
.topic.feature{border-color:color-mix(in srgb,var(--amber) 55%,var(--line))}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font:500 .78rem var(--f-mono);border:1px solid var(--line);color:var(--muted);background:var(--surface2);white-space:nowrap}
.pill.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 50%,var(--line))}
.pill.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,var(--line))}
.pill.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,var(--line))}
.thumb{height:120px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,var(--surface2));color:var(--tc);margin-bottom:14px}
.proj{display:flex;flex-direction:column}
.proj h3{margin-bottom:4px}
.proj p{color:var(--muted);font-size:.95rem;margin-bottom:12px}
.proj .row{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.cta-band{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(24px,5vw,48px);display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.cta-band>div{min-width:0;flex:1 1 320px;display:flex;flex-direction:column;gap:8px}

/* lessons */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500}
.chip:hover{color:var(--fg);border-color:var(--cyan)}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--on-accent)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.lcard{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:transform .18s,border-color .18s;min-width:0}
.lcard:hover{transform:translateY(-3px);border-color:var(--cyan)}
.lcard h3{font-size:1.1rem}
.lcard .pills{display:flex;flex-wrap:wrap;gap:6px}
.lcard .done{margin-top:auto;color:var(--green);font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.progress{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:999px;transition:width .4s}
.prog-row{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.prog-row .lab{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}

/* lesson detail */
.crumb{background:none;border:0;color:var(--cyan);cursor:pointer;padding:8px 0;font-weight:500}
.detail{display:grid;gap:20px;max-width:860px}
.detail h1{font-size:clamp(1.8rem,4.5vw,2.6rem)}
.block{display:flex;flex-direction:column;gap:12px;min-width:0}
.block>h2{font-size:1.25rem}
.hint{display:flex;gap:12px;align-items:flex-start}
.hint .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--violet);color:var(--on-accent);display:grid;place-items:center;font:600 .85rem var(--f-mono)}
.code{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.code header{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);font:500 .8rem var(--f-mono);color:var(--muted)}
.code pre{margin:0;padding:16px;overflow-x:auto;font:400 .92rem/1.65 var(--f-mono);color:var(--fg);tab-size:4}
.answer{white-space:pre-wrap}
.explain{border-left:4px solid var(--cyan);background:var(--surface);padding:12px 16px;border-radius:var(--r-sm);color:var(--muted)}
.explain b{color:var(--fg)}
.bugnote{font:500 .8rem var(--f-mono);color:var(--red);letter-spacing:.06em;text-transform:uppercase}

/* forms */
.formcard{max-width:520px;margin-inline:auto}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:999px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{flex:1 1 auto;border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--violet);color:var(--on-accent)}
form.f{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:600;font-size:.92rem}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-height:44px;width:100%}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 30%,transparent)}
.field [aria-invalid="true"]{border-color:var(--red)}
.err{color:var(--red);font-size:.88rem}
.err:empty{display:none}
.help{color:var(--muted);font-size:.85rem}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--violet)}
.meter{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--red);transition:width .2s,background .2s}
.notice{border:1px solid var(--line);border-left:4px solid var(--cyan);background:var(--surface);padding:12px 16px;border-radius:var(--r-sm);color:var(--muted);font-size:.92rem}
.notice.warn{border-left-color:var(--amber)}
.notice b{color:var(--fg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* AI chat */
.askgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
.chat{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);height:min(78vh,780px);min-height:480px;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.msg{min-width:0}
.msg.user{align-self:flex-end;max-width:88%;background:var(--violet);color:var(--on-accent);border-radius:16px 16px 4px 16px;padding:10px 14px;white-space:pre-wrap}
.msg.ai{align-self:stretch;max-width:100%;background:var(--surface2);border-radius:16px 16px 16px 4px;padding:6px 16px 12px}
.msg.err{align-self:flex-start;background:color-mix(in srgb,var(--red) 14%,var(--surface2));border:1px solid color-mix(in srgb,var(--red) 40%,var(--line));border-radius:var(--r-sm);padding:10px 14px;font-size:.95rem}
.msg.local{align-self:stretch;background:var(--surface2);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.who{font:500 .74rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);margin-top:8px}
.md h4{font-size:1.05rem;margin:14px 0 4px;color:var(--cyan)}
.md p{margin:6px 0}
.md ol,.md ul{margin:6px 0;padding-left:24px}
.md li{margin:3px 0}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--bg);padding:1px 6px;border-radius:6px}
.md .ws{margin:8px 0}
.md pre.codeblk{margin:8px 0;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);overflow-x:auto;font:400 .88rem/1.6 var(--f-mono)}
.md pre.codeblk code{background:none;padding:0}
.think{color:var(--muted);display:flex;gap:8px;align-items:center;padding:8px 0}
.think i{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:pulse 1.2s infinite ease-in-out}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.composer{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.composer .rowc{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-height:46px;max-height:160px;resize:vertical;line-height:1.5}
.composer textarea:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 30%,transparent)}
.ctxchip{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:.85rem;color:var(--muted);align-self:flex-start;max-width:100%}
.ctxchip b{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctxchip button{background:none;border:0;cursor:pointer;color:var(--muted);width:24px;height:24px;border-radius:50%;font-size:1rem;line-height:1}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.suggest{display:flex;flex-direction:column;gap:8px}
.suggest button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;color:var(--fg);font-size:.92rem}
.suggest button:hover{border-color:var(--cyan)}


/* chat app (kiểu Claude) */
.chatapp{position:relative;display:grid;grid-template-columns:268px minmax(0,1fr);height:calc(100dvh - 170px);min-height:540px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.csb{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg);padding:10px;gap:10px}
.csb .newc{width:100%;justify-content:center}
.csb input[type=search]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;color:var(--fg)}
.clist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.citem{display:flex;align-items:center;border-radius:var(--r-sm)}
.citem:hover,.citem.on{background:var(--surface2)}
.ctitle{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--fg);padding:9px 10px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
.cbtn{background:none;border:0;color:var(--muted);cursor:pointer;min-width:30px;height:32px;border-radius:8px}
.cbtn:hover{color:var(--fg);background:var(--line)}
.cbtn.armed{color:var(--red);font-size:.8rem;padding-inline:6px}
.citem input{width:100%;margin:4px;background:var(--surface);border:1px solid var(--cyan);border-radius:8px;padding:6px 8px;color:var(--fg)}
.cmain{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.cbar{display:none;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.scrim{display:none}
.chatapp .msgs{padding:20px 16px;align-items:center;gap:18px}
.chatapp .msgs>*{width:min(100%,780px)}
.urow{display:flex;justify-content:flex-end;align-items:flex-start;gap:6px}
.urow .mact{opacity:0}
.urow:hover .mact,.urow .mact:focus{opacity:1}
.msg.ai{background:none;border-radius:0;padding:0}
.chatapp .msg.user{max-width:88%;border-radius:18px 18px 4px 18px}
.ichip{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font:500 .68rem var(--f-mono);letter-spacing:.04em;text-transform:none;background:color-mix(in srgb,var(--violet) 22%,transparent);color:var(--fg)}
.ichip.i-scratch{background:color-mix(in srgb,#FFAB19 30%,transparent)}
.ichip.i-code{background:color-mix(in srgb,var(--cyan) 26%,transparent)}
.macts{display:flex;gap:6px;margin-top:8px}
.mact{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;border-radius:8px;padding:4px 10px;font-size:.82rem}
.mact:hover{border-color:var(--line);color:var(--fg)}
.fq{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.fq button{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--fg);cursor:pointer;font-size:.9rem}
.fq button:hover{border-color:var(--cyan)}
.sbfig{margin:10px 0;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}

<script>
/* ===== Scratch block renderer (Scratch 3 look, SVG) ===== */
const SB=(function(){
'use strict';
const COL={motion:['#4C97FF','#3373CC'],looks:['#9966FF','#774DCB'],sound:['#CF63CF','#BD42BD'],events:['#FFBF00','#CC9900'],control:['#FFAB19','#CF8B17'],sensing:['#5CB1D6','#2E8EB8'],operators:['#59C059','#389438'],variables:['#FF8C1A','#DB6E00'],other:['#9AA0AB','#6E7480']};
const FONT='"Helvetica Neue",Helvetica,Arial,sans-serif';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cx=null;
function tw(s){
  if(!cx){cx=document.createElement('canvas').getContext('2d')}
  cx.font='600 12px '+FONT;
  return cx.measureText(String(s)).width;
}

/* ---- scanning ---- */
function match(s,i){
  const o=s[i];
  if(o==='['){for(let j=i+1;j<s.length;j++)if(s[j]===']')return j;return -1}
  if(o==='('){
    let d=0;
    for(let j=i;j<s.length;j++){
      const c=s[j];
      if(c==='['){const k=match(s,j);if(k<0)return -1;j=k;continue}
      if(c==='(')d++;else if(c===')'){d--;if(d===0)return j}
    }
    return -1;
  }
  let d=0;
  for(let j=i;j<s.length;j++){
    const c=s[j];
    if(c==='['||c==='('){const k=match(s,j);if(k<0)return -1;j=k;continue}
    if(c==='<'&&s[j+1]!==undefined&&!/\s/.test(s[j+1]))d++;
    else if(c==='>'&&j>0&&!/\s/.test(s[j-1])){d--;if(d===0)return j}
  }
  return -1;
}
function scan(str){
  const out=[];let i=0,w='';
  const flush=()=>{if(w){out.push({t:'w',v:w});w=''}};
  while(i<str.length){
    const c=str[i];
    if(c===' '||c==='\t'){flush();i++;continue}
    if(c==='('||c==='['||c==='<'){
      if(c==='<'&&(str[i+1]===undefined||/\s/.test(str[i+1]))){w+=c;i++;continue}
      const j=match(str,i);
      if(j<0){w+=c;i++;continue}
      flush();out.push({t:c,v:str.slice(i+1,j)});i=j+1;continue;
    }
    w+=c;i++;
  }
  flush();return out;
}

/* ---- parsing ---- */
const KNOWN={'answer':'sensing','mouse x':'sensing','mouse y':'sensing','timer':'sensing','loudness':'sensing','username':'sensing','volume':'sound','size':'looks','x position':'motion','y position':'motion','direction':'motion'};
function parseTok(tk){
  if(tk.t==='w')return {k:'label',v:tk.v};
  if(tk.t==='['){const m=tk.v.match(/^(.*) v$/);return m?{k:'dd',v:m[1]}:{k:'txt',v:tk.v}}
  if(tk.t==='<'){
    const inner=tk.v.trim();
    if(!inner)return {k:'ebool'};
    return mkBlock(scan(inner),'bool');
  }
  const inner=tk.v.trim();
  if(!inner)return {k:'num',v:''};
  if(/^-?\d*\.?\d+$/.test(inner))return {k:'num',v:inner};
  if(/[(\[<]/.test(inner))return mkBlock(scan(inner),'rep');
  return {k:'rep',items:[{k:'label',v:inner}],name:inner.toLowerCase(),cat:KNOWN[inner.toLowerCase()]||'variables'};
}
function mkBlock(toks,kind){
  const items=toks.map(parseTok);
  const n={k:kind,items};
  n.cat=catOf(items,kind);
  return n;
}
const MATH=['abs','floor','ceiling','sqrt','sin','cos','tan','asin','acos','atan','ln','log','e ^','10 ^'];
function normOf(items){
  return items.map(it=>it.k==='label'?it.v.toLowerCase():'_').join(' ');
}
function firstDD(items){const d=items.find(it=>it.k==='dd');return d?d.v.toLowerCase():''}
function catOf(items,kind){
  if(kind==='rep'&&items.length===1&&items[0].k==='label'){
    const nm=items[0].v.toLowerCase();
    return KNOWN[nm]||'variables';
  }
  const n=normOf(items);
  const dd=firstDD(items);
  if(/^(move|turn|go to x|glide|point|change x|set x|change y|set y|if on edge)/.test(n)||n==='go to _')return 'motion';
  if(/^(change|set) _ effect/.test(n))return /pitch|pan/.test(dd)?'sound':'looks';
  if(/^set size|^change size/.test(n)||/^(say|think|switch costume|next costume|switch backdrop|next backdrop|clear graphic)/.test(n)||n==='go to _ layer'||n==='go _ _ layers'||n==='show'||n==='hide'||/^(costume|backdrop) _$/.test(n))return 'looks';
  if(/^(play sound|start sound|stop all sounds|clear sound effects|change volume|set volume)/.test(n))return 'sound';
  if(/^when i start as a clone|^create clone|^delete this clone/.test(n))return 'control';
  if(/^(when |broadcast )/.test(n))return 'events';
  if(/^(wait|repeat|forever|if|else|stop)/.test(n))return 'control';
  if(n==='_ of _'&&MATH.includes(dd))return 'operators';
  if(/^(touching|color|distance to|ask|key|mouse|set drag mode|reset timer|current|days since)/.test(n)||n==='_ of _')return 'sensing';
  if(/^_ (\+|-|\*|\/|>|<|=|and|or|mod) _$/.test(n)||/^(pick random|not|join|letter|length of|round)/.test(n)||/^_ contains/.test(n))return 'operators';
  if(/^(show|hide) variable/.test(n)||/^(set|change) _ (to|by) _$/.test(n))return 'variables';
  return 'other';
}
function parseScripts(src){
  const lines=String(src).replace(/\r/g,'').split('\n');
  const scripts=[];let cur={blocks:[]};const open=[];
  const add=b=>{
    if(open.length){const o=open[open.length-1];o.secs[o.secs.length-1].kids.push(b)}
    else cur.blocks.push(b);
  };
  const endScript=()=>{if(cur.blocks.length){scripts.push(cur);cur={blocks:[]}}};
  for(const raw of lines){
    const line=raw.trim();
    if(!line){if(!open.length)endScript();continue}
    if(line.startsWith('//'))continue;
    if(line==='end'){open.pop();continue}
    if(line==='else'){if(open.length)open[open.length-1].secs.push({items:[{k:'label',v:'else'}],kids:[],isElse:true});continue}
    const toks=scan(line);
    if(!toks.length)continue;
    if(toks.length===1&&(toks[0].t==='('||toks[0].t==='<')){
      const nd=parseTok(toks[0]);
      if(nd.k==='rep'||nd.k==='bool'){if(!open.length)endScript();add({k:'inline',node:nd});if(!open.length)endScript();continue}
    }
    const items=toks.map(parseTok);
    const n=normOf(items);
    const cat=catOf(items,'blk');
    let b;
    if(/^(forever|repeat _|repeat until _|if _ then)$/.test(n)){
      b={k:'blk',shape:'c',cat:'control',secs:[{items,kids:[]}],noBottom:n==='forever'};
      add(b);open.push(b);continue;
    }
    let shape='stack';
    if(/^when /.test(n))shape='hat';
    else if(/^(stop|delete this clone)/.test(n))shape='cap';
    b={k:'blk',shape,cat,items};
    add(b);
  }
  endScript();
  return scripts;
}

/* ---- layout ---- */
function sizeItem(it){
  if(it.sz)return it.sz;
  let w=0,h=0;
  switch(it.k){
    case 'label':
      if(it.v==='@greenFlag'||it.v==='@turnRight'||it.v==='@turnLeft'){w=18;h=18}
      else{w=tw(it.v);h=14}
      break;
    case 'num':case 'txt':if(it.k==='txt'&&/^#[0-9a-f]{3,6}$/i.test(it.v)){w=34;h=24}else{w=Math.max(26,tw(it.v)+16);h=24}break;
    case 'dd':w=tw(it.v)+16+14;h=24;break;
    case 'ebool':w=38;h=24;break;
    case 'rep':case 'bool':layoutInline(it);w=it.w;h=it.h;break;
  }
  it.sz={w,h};return it.sz;
}
function layoutRow(n,padX,vpad,minH){
  let x=padX,mh=0;n.xs=[];
  n.items.forEach((it,i)=>{
    const s=sizeItem(it);
    n.xs.push(x);x+=s.w+(i<n.items.length-1?6:0);
    mh=Math.max(mh,s.h);
  });
  n.w=x+padX;n.h=Math.max(minH,mh+vpad);
}
function layoutInline(n){
  if(n.w)return;
  if(n.k==='bool')layoutRow(n,14,4,24);else layoutRow(n,9,4,24);
}
function layoutBlock(b){
  if(b.k==='inline'){layoutInline(b.node);b.w=b.node.w;b.h=b.top=0;b.H=b.node.h;return}
  if(b.shape==='c'){
    let w=64,H=0;
    b.secs.forEach((s,i)=>{
      s.n={items:s.items};
      layoutRow(s.n,10,8,i===0?32:24);
      s.hh=s.n.h;
      s.kids.forEach(layoutBlock);
      s.ih=s.kids.length?s.kids.reduce((a,k)=>a+k.H,0):24;
      const iw=s.kids.reduce((a,k)=>Math.max(a,k.w),0);
      w=Math.max(w,s.n.w,iw?16+iw:0);
      H+=s.hh+s.ih;
    });
    b.bh=24;b.w=w;b.top=0;b.H=H+b.bh;return;
  }
  layoutRow(b,10,8,32);
  if(b.shape==='hat'){b.w=Math.max(b.w,100);b.top=16}else b.top=0;
  b.H=b.top+b.h;
}

/* ---- drawing ---- */
const P=(n)=>Math.round(n*100)/100;
function notchTop(){return 'H12 L16,4 H28 L32,0'}
function sPath(w,h,noBottom,hat){
  let d;
  if(hat)d=`M0,16 C2,4 24,0 46,0 C66,0 84,5 90,16 H${w-4} a4,4 0 0 1 4,4`;
  else d=`M4,0 ${notchTop()} H${w-4} a4,4 0 0 1 4,4`;
  const t=hat?16:0;
  d+=` V${t+h-4} a4,4 0 0 1 -4,4`;
  if(noBottom)d+=` H4`;
  else d+=` H32 L28,${t+h+4} H16 L12,${t+h} H4`;
  d+=` a4,4 0 0 1 -4,-4`;
  if(hat)d+=` V16 Z`;else d+=` V4 a4,4 0 0 1 4,-4 Z`;
  return d;
}
function cPath(w,b){
  let d=`M4,0 ${notchTop()} H${w-4} a4,4 0 0 1 4,4`;
  let y=0;
  b.secs.forEach((s,i)=>{
    y+=s.hh;
    d+=` V${y-4} a4,4 0 0 1 -4,4 H48 L44,${y+4} H32 L28,${y} H20 a4,4 0 0 0 -4,4`;
    y+=s.ih;
    d+=` V${y-4} a4,4 0 0 0 4,4`;
    if(i<b.secs.length-1)d+=` H${w-4} a4,4 0 0 1 4,4`;
  });
  d+=` H${w-4} a4,4 0 0 1 4,4 V${y+b.bh-4} a4,4 0 0 1 -4,4`;
  if(b.noBottom)d+=` H4`;else d+=` H32 L${28},${y+b.bh+4} H16 L12,${y+b.bh} H4`;
  d+=` a4,4 0 0 1 -4,-4 V4 a4,4 0 0 1 4,-4 Z`;
  return d;
}
function hexPath(w,h){const r=h/2;return `M${r},0 H${w-r} L${w},${r} L${w-r},${h} H${r} L0,${r} Z`}
function drawItems(n,x0,y0,rowH,cat){
  const [fill,stroke]=COL[cat]||COL.other;
  let g='';
  n.items.forEach((it,i)=>{
    const s=it.sz,x=x0+n.xs[i],y=y0+(rowH-s.h)/2;
    switch(it.k){
      case 'label':
        if(it.v==='@greenFlag')g+=`<g transform="translate(${P(x+1)},${P(y+1)})"><path d="M3 1V16" stroke="#45993D" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M3 2.5C6 .5 8.5 4.5 12 2.5 14 1.5 15 1.8 16 2.2V9C14 8.3 12 8.6 10 9.6 7 11 5.5 7.2 3 9.2Z" fill="#4CBF56" stroke="#45993D" stroke-width="1.2" stroke-linejoin="round"/></g>`;
        else if(it.v==='@turnRight'||it.v==='@turnLeft')g+=`<text x="${P(x+s.w/2)}" y="${P(y+s.h/2+5)}" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">${it.v==='@turnRight'?'↻':'↺'}</text>`;
        else g+=`<text x="${P(x)}" y="${P(y+s.h/2+4.2)}" fill="#fff">${esc(it.v)}</text>`;
        break;
      case 'num':case 'txt':
        if(it.k==='txt'&&/^#[0-9a-f]{3,6}$/i.test(it.v)){g+=`<rect x="${P(x)}" y="${P(y)}" width="${P(s.w)}" height="${s.h}" rx="12" fill="${esc(it.v)}" stroke="#fff" stroke-width="2"/>`;break}
        g+=`<rect x="${P(x)}" y="${P(y)}" width="${P(s.w)}" height="${s.h}" rx="12" fill="#fff" stroke="${stroke}"/><text x="${P(x+s.w/2)}" y="${P(y+s.h/2+4.2)}" text-anchor="middle" fill="#575E75" font-weight="500">${esc(it.v)}</text>`;
        break;
      case 'dd':
        g+=`<rect x="${P(x)}" y="${P(y)}" width="${P(s.w)}" height="${s.h}" rx="12" fill="${stroke}" stroke="${stroke}"/><text x="${P(x+9)}" y="${P(y+s.h/2+4.2)}" fill="#fff">${esc(it.v)}</text><path d="M${P(x+s.w-16)},${P(y+9.5)} h8 l-4,5 Z" fill="#fff"/>`;
        break;
      case 'ebool':
        g+=`<path transform="translate(${P(x)},${P(y)})" d="${hexPath(s.w,s.h)}" fill="${stroke}" stroke="${stroke}"/>`;
        break;
      case 'rep':case 'bool':g+=drawInline(it,x,y);break;
    }
  });
  return g;
}
function drawInline(n,x,y){
  const [fill,stroke]=COL[n.cat]||COL.other;
  const shape=n.k==='bool'?`<path d="${hexPath(n.w,n.h)}" fill="${fill}" stroke="${stroke}"/>`:`<rect width="${P(n.w)}" height="${n.h}" rx="${n.h/2}" fill="${fill}" stroke="${stroke}"/>`;
  return `<g transform="translate(${P(x)},${P(y)})">${shape}${drawItems(n,0,0,n.h,n.cat)}</g>`;
}
function drawBlock(b,x,y){
  if(b.k==='inline')return drawInline(b.node,x,y);
  const [fill,stroke]=COL[b.cat]||COL.other;
  if(b.shape==='c'){
    let g=`<g transform="translate(${P(x)},${P(y)})"><path d="${cPath(b.w,b)}" fill="${fill}" stroke="${stroke}"/>`;
    let yy=0;
    b.secs.forEach(s=>{
      g+=drawItems(s.n,0,yy,s.hh,b.cat);
      yy+=s.hh;
      let ky=yy;
      s.kids.forEach(k=>{g+=drawBlock(k,16,ky);ky+=k.H});
      yy+=s.ih;
    });
    return g+'</g>';
  }
  const t=b.top;
  const body=`<path d="${sPath(b.w,b.h,b.shape==='cap',b.shape==='hat')}" fill="${fill}" stroke="${stroke}"/>`;
  return `<g transform="translate(${P(x)},${P(y)})">${body}${drawItems(b,0,t,b.h,b.cat)}</g>`;
}
function render(src,opt){
  opt=opt||{};
  try{
    const scripts=parseScripts(src);
    if(!scripts.length)return `<pre class="sb-fallback">${esc(src)}</pre>`;
    let y=4,W=0,body='';
    scripts.forEach((sc,si)=>{
      let yy=y;
      sc.blocks.forEach(b=>{layoutBlock(b);body+=drawBlock(b,4,yy);yy+=b.H;W=Math.max(W,b.w)});
      y=yy+(sc.blocks.length&&sc.blocks[sc.blocks.length-1].shape==='cap'?0:4)+14;
    });
    const H=y-14+4,Wt=W+10;
    const sc=opt.scale||1;
    return `<svg class="sbsvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Khối lệnh Scratch" width="${P(Wt*sc)}" height="${P(H*sc)}" viewBox="0 0 ${P(Wt)} ${P(H)}"><g font-family='${FONT}' font-size="12" font-weight="600" stroke-width="1">${body}</g></svg>`;
  }catch(e){
    return `<pre class="sb-fallback">${esc(src)}</pre>`;
  }
}
return {render,parseScripts,esc};
})();

 S('s09',5,'Bài 14','Trò chơi đoán số','Khó',
  'Máy chọn ngẫu nhiên một số từ 1 đến 10. Người chơi đoán đến khi đúng, máy gợi ý số đoán nhỏ quá hay lớn quá.',
  ['Máy cần “nghĩ” một số bí mật: dùng pick random 1 to 10 và lưu vào biến bimat.','Chưa biết người chơi đoán bao nhiêu lần nên dùng repeat until: lặp đến khi answer = bimat.','Bên trong vòng lặp, so sánh để gợi ý nhỏ quá hay lớn quá, rồi hỏi lại bằng ask … and wait.'],
  `when @greenFlag clicked
set [bimat v] to (pick random (1) to (10))
ask [Đoán số từ 1 đến 10:] and wait
repeat until <(answer) = (bimat)>
  if <(answer) < (bimat)> then
    ask [Nhỏ quá! Đoán lại:] and wait
  else
    ask [Lớn quá! Đoán lại:] and wait
  end
end
say [Chính xác! Bạn đoán đúng rồi.]`,'scratch',
  'Chương trình kết hợp biến, số ngẫu nhiên, vòng lặp có điều kiện và rẽ nhánh. Khi vòng lặp kết thúc nghĩa là người chơi đã đoán đúng.'),
 S('s10',5,'Bài 13','Đếm số lần bấm vào mèo','Vừa',
  'Mỗi lần bấm chuột vào con mèo thì điểm tăng 1 và mèo nói điểm hiện tại. Khi bấm cờ xanh, điểm quay về 0.',
  ['Hai việc xảy ra ở hai thời điểm khác nhau nên cần hai chương trình riêng: một khi bấm cờ xanh, một khi bấm vào nhân vật.','Khi bấm cờ xanh, đặt biến diem về 0.','Khi bấm vào nhân vật, dùng change diem by 1 rồi nói giá trị mới của biến.'],
  `when @greenFlag clicked
set [diem v] to (0)

when this sprite clicked
change [diem v] by (1)
say (join [Điểm: ] (diem)) for (1) seconds`,'scratch',
  'Sự kiện (nhóm Events) kích hoạt từng chương trình. Biến diem được dùng chung giữa hai chương trình.'),
 S('s11',5,'Bài 15','Gỡ lỗi: hình vuông bị lệch','Dễ',
  'Chương trình dưới đây muốn cho mèo đi theo hình vuông nhưng sau khi chạy, mèo không trở về đúng điểm xuất phát. Hãy tìm lỗi và sửa.',
  ['Chạy từng bước và quan sát: sau mỗi cạnh mèo quay bao nhiêu độ?','Hình vuông có các góc 90°. Sau 4 cạnh, tổng các lần quay phải là 360°.','Kiểm tra số nằm trong khối turn.'],
  `when @greenFlag clicked
go to x: (-50) y: (-50)
point in direction (90)
repeat (4)
  move (100) steps
  turn @turnLeft (90) degrees
end`,'scratch',
  'Đây là lỗi logic: chương trình vẫn chạy nhưng cho kết quả sai. 4 × 80° = 320° chứ không phải 360°, nên đường đi không khép kín. Sửa 80 thành 90.',
  `when @greenFlag clicked
go to x: (-50) y: (-50)
point in direction (90)
repeat (4)
  move (100) steps
  turn @turnLeft (80) degrees
end`),
 S('s12',5,'Bài 15','Gỡ lỗi: chu vi ra sai','Vừa',
  'Bạn Lan nhập chiều dài 5, chiều rộng 3 và mong chu vi là 16 nhưng chương trình nói 13. Hãy tìm lỗi và sửa.',
  ['Tự tính tay: chu vi = (5 + 3) × 2 = 16. Chương trình ra 13, vậy phép tính ở đâu sai?','Xem khối set chuvi: phép nhân 2 đang áp dụng cho biến nào?','Phép cộng phải được tính trước rồi mới nhân 2: đặt khối + vào bên trong khối *.'],
  `when @greenFlag clicked
ask [Nhập chiều dài:] and wait
set [dai v] to (answer)
ask [Nhập chiều rộng:] and wait
set [rong v] to (answer)
set [chuvi v] to (((dai) + (rong)) * (2))
say (chuvi)`,'scratch',
  'Chương trình cũ tính (dai × 2) + rong = 13 vì thiếu lồng khối +. Muốn cộng trước rồi nhân thì khối + phải nằm bên trong khối *.',
  `when @greenFlag clicked
ask [Nhập chiều dài:] and wait
set [dai v] to (answer)
ask [Nhập chiều rộng:] and wait
set [rong v] to (answer)
set [chuvi v] to (((dai) * (2)) + (rong))
say (chuvi)`),

 S('t01',1,'Bài 1','Công cụ tính toán qua các thời kì','Dễ',
  'Kể tên ít nhất ba công cụ tính toán trong lịch sử. Nêu một điểm khác nhau giữa công cụ tính toán thủ công và máy tính điện tử.',
  ['Nghĩ tới những thứ con người dùng để tính từ xưa: que tính, bàn tính, máy tính cơ học.','Công cụ thủ công cần người thao tác từng bước. Máy tính điện tử làm theo chương trình đã nạp sẵn.','So sánh theo các mặt: tốc độ, độ chính xác, lượng dữ liệu xử lý được.'],
  `Ba công cụ: bàn tính, que tính Napier, máy tính cơ học của Pascal.
Khác nhau: công cụ thủ công tính chậm, dễ nhầm và phải làm từng phép tính. Máy tính điện tử tính rất nhanh, chính xác và tự chạy theo chương trình.`,'text',''),
 S('t02',2,'Bài 2','Kiểm tra độ tin cậy của thông tin','Vừa',
  'Một tin nhắn được chuyển tiếp nhiều lần: “Uống nước chanh nóng mỗi sáng chữa khỏi mọi bệnh, chia sẻ ngay cho mọi người!”. Nêu ba cách để kiểm tra xem thông tin này có đáng tin không.',
  ['Hỏi: tin này từ đâu ra, ai là tác giả, đăng khi nào?','Tin đáng tin thường có bằng chứng và được nhiều nguồn chính thống nhắc đến.','Cẩn thận với những tin gây cảm xúc mạnh hoặc thúc giục chia sẻ ngay.'],
  `1. Kiểm tra nguồn: không rõ người đăng, không có tên tổ chức uy tín.
2. Đối chiếu: tìm trên trang báo chính thống hoặc trang của cơ quan y tế. Nếu không nơi nào nhắc tới thì đáng nghi.
3. Xem nội dung: “chữa khỏi mọi bệnh” là lời khẳng định tuyệt đối và thiếu bằng chứng.
Không chia sẻ khi chưa kiểm chứng.`,'text',''),
 S('t03',2,'Bài 3','Thực hành tìm kiếm thông tin','Dễ',
  'Em cần tìm diện tích của thành phố nơi em sống. Hãy viết từ khóa tìm kiếm phù hợp và cách ghi lại nguồn thông tin.',
  ['Chọn từ khóa chính: tên thành phố và từ “diện tích”.','Đặt cụm từ quan trọng trong dấu ngoặc kép để máy tìm đúng cụm đó.','Ưu tiên trang cơ quan nhà nước hoặc báo chính thống. Ghi lại tên trang, địa chỉ và ngày xem.'],
  `"diện tích" "thành phố Đà Nẵng"
diện tích thành phố Đà Nẵng site:gov.vn

Ghi nguồn: Tên trang – địa chỉ trang – ngày truy cập`,'formula','Từ khóa ngắn, đúng trọng tâm cho kết quả tốt hơn viết nguyên câu hỏi. Toán tử site: giới hạn kết quả trong một loại trang.'),
 S('t04',3,'Bài 4','Ứng xử trên mạng','Vừa',
  'Bạn A chụp ảnh bạn B đang ngủ gật trong lớp rồi đăng lên mạng xã hội kèm lời chế giễu. Hành động này sai ở đâu? Em sẽ khuyên A thế nào?',
  ['Hỏi bạn B có đồng ý cho đăng ảnh của mình không?','Nghĩ tới cảm xúc của B và việc ảnh có thể lan rộng, khó xóa hết.','Pháp luật bảo vệ hình ảnh, danh dự và nhân phẩm của mỗi người.'],
  `Sai ở chỗ: đăng ảnh khi chưa được B đồng ý (xâm phạm quyền riêng tư và hình ảnh), chế giễu B (bắt nạt trên mạng), và ảnh có thể lan rộng khó gỡ.
Khuyên A: gỡ bài ngay, xin lỗi B, không đăng ảnh người khác khi chưa được phép. Nếu B bị ảnh hưởng nhiều, báo thầy cô hoặc phụ huynh để cùng giải quyết.`,'text',''),
 S('t05',4,'Bài 5','Tính tổng, trung bình, lớn nhất','Dễ',
  'Bảng tính ghi số tiền chi tiêu (nghìn đồng) trong 7 ngày ở các ô B2 đến B8. Viết công thức tính tổng chi tiêu, chi tiêu trung bình mỗi ngày và số tiền chi nhiều nhất trong một ngày.',
  ['Công thức luôn bắt đầu bằng dấu =.','Các hàm cần dùng: SUM (tổng), AVERAGE (trung bình), MAX (lớn nhất).','Dãy ô liên tiếp viết dạng B2:B8.'],
  `=SUM(B2:B8)
=AVERAGE(B2:B8)
=MAX(B2:B8)`,'formula','Khi số liệu thay đổi, kết quả tự cập nhật. Đó là lợi ích của dùng công thức thay vì gõ số trực tiếp.'),
 S('t06',4,'Bài 5','Thành tiền và địa chỉ ô tuyệt đối','Vừa',
  'Bảng hóa đơn: cột C là đơn giá, cột D là số lượng (hàng 2 đến hàng 6). Tính thành tiền ở cột E. Thuế VAT 10% nhập ở ô G1. Tính tiền thuế ở cột F cho mọi hàng và tổng tiền phải trả.',
  ['Thành tiền = đơn giá × số lượng: E2 = C2*D2, rồi kéo công thức xuống.','Tiền thuế = thành tiền × thuế suất. Thuế suất luôn nằm ở ô G1 nên khi kéo công thức xuống, ô này không được dịch chuyển.','Thêm dấu $ trước cột và hàng để cố định ô: $G$1. Tổng cộng dùng SUM.'],
  `E2: =C2*D2
F2: =E2*$G$1
E7: =SUM(E2:E6)
F7: =SUM(F2:F6)
E8: =E7+F7`,'formula','Địa chỉ tương đối (E2) thay đổi khi sao chép công thức, địa chỉ tuyệt đối ($G$1) giữ nguyên.'),
 S('t07',4,'Bài 6','Sắp xếp và lọc dữ liệu','Vừa',
  'Bảng điểm lớp có các cột: Họ tên, Toán, Văn, Tin, Tổng. a) Sắp xếp danh sách theo Tổng giảm dần. b) Lọc ra các bạn có điểm Toán từ 8 trở lên.',
  ['Chọn cả bảng, kể cả hàng tiêu đề, trước khi sắp xếp hoặc lọc.','Sắp xếp: thẻ Data (Dữ liệu) → Sort, chọn cột Tổng và thứ tự từ lớn đến nhỏ.','Lọc: Data → Filter, bấm mũi tên ở cột Toán, chọn Number Filters rồi điều kiện lớn hơn hoặc bằng 8.'],
  `a) Data → Sort → Sort by: Tổng → Order: Largest to Smallest → OK
b) Data → Filter → bấm ▾ ở cột Toán → Number Filters → Greater Than Or Equal To… → 8 → OK`,'formula','Sắp xếp đổi thứ tự các hàng. Lọc chỉ ẩn các hàng không thỏa điều kiện, dữ liệu gốc vẫn còn.'),
 S('t08',4,'Bài 7','Chọn biểu đồ phù hợp','Vừa',
  'Bảng thống kê số học sinh giỏi của bốn lớp 8A, 8B, 8C, 8D. Em chọn loại biểu đồ nào để so sánh giữa các lớp? Nêu các bước tạo biểu đồ.',
  ['Xác định mục đích: so sánh số lượng giữa các nhóm, theo dõi theo thời gian hay xem tỉ lệ trong tổng thể?','Biểu đồ cột để so sánh số lượng, biểu đồ tròn để thể hiện tỉ lệ, biểu đồ đường để thể hiện xu hướng theo thời gian.','Chọn vùng dữ liệu gồm tên lớp và số lượng, rồi dùng Insert → Chart.'],
  `Chọn biểu đồ cột vì cần so sánh số lượng giữa các lớp.
Các bước: chọn vùng dữ liệu (tên lớp và số học sinh giỏi) → Insert → Chart → chọn Column → thêm tiêu đề biểu đồ và tên các trục.`,'text',''),
 S('t09',6,'Bài 16','Tin học với nghề nghiệp','Dễ',
  'Chọn một nghề em quan tâm. Nêu hai ứng dụng của tin học trong nghề đó và một kĩ năng em cần rèn luyện.',
  ['Chọn một nghề em thấy thú vị, ví dụ bác sĩ, giáo viên, kiến trúc sư.','Nghĩ xem người làm nghề đó dùng máy tính, phần mềm hoặc dữ liệu vào việc gì.','Kĩ năng có thể là dùng phần mềm, tìm kiếm thông tin, làm việc nhóm trực tuyến, bảo vệ thông tin.'],
  `Ví dụ nghề bác sĩ:
- Ứng dụng 1: lưu hồ sơ bệnh án điện tử để tra cứu nhanh.
- Ứng dụng 2: phần mềm hỗ trợ chẩn đoán qua hình ảnh.
- Kĩ năng cần rèn luyện: sử dụng phần mềm chuyên ngành và bảo mật thông tin bệnh nhân.`,'text','')
];

  if(!h)return null;
  const i=h.indexOf('-');const name=i<0?h:h.slice(0,i);const id=i<0?null:h.slice(i+1);

function sparks(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const r=el.getBoundingClientRect();const cs=['--violet','--cyan','--amber','--green'];
  for(let i=0;i<18;i++){
    const s=document.createElement('i');s.className='spark';
    const a=Math.random()*Math.PI*2,d=50+Math.random()*80;
    s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;background:var(${cs[i%4]});--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--rot:${Math.random()*360}deg`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
  }
}

/* ---------- markdown for AI answers ---------- */
function inl(s){return esc(s).replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}
function mdText(t){
  let out='',list=null,para=[];
  const flushP=()=>{if(para.length){out+='<p>'+para.map(inl).join('<br>')+'</p>';para=[]}};
  const closeL=()=>{if(list){out+='</'+list+'>';list=null}};
  for(const raw of t.split('\n')){
    const l=raw.trimEnd();let m;
    if(!l.trim()){flushP();closeL();continue}
    if((m=l.match(/^#{1,4}\s+(.*)$/))){flushP();closeL();out+='<h4>'+inl(m[1])+'</h4>';continue}
    if((m=l.match(/^\s*(\d+)[.)]\s+(.*)$/))){flushP();if(list!=='ol'){closeL();out+=`<ol start="${+m[1]}">`;list='ol'}out+='<li>'+inl(m[2])+'</li>';continue}
    if((m=l.match(/^\s*[-*•]\s+(.*)$/))){flushP();if(list!=='ul'){closeL();out+='<ul>';list='ul'}out+='<li>'+inl(m[1])+'</li>';continue}
    closeL();para.push(l);
  }
  flushP();closeL();return out;
}
function fence(lang,code,closed){
  if(/^(scratch|sb|blocks)$/.test(lang)){
    if(closed)return `<figure class="sbfig" data-src="${esc(code)}"><div class="sbbar"><span>Khối lệnh Scratch</span><span><button type="button" data-act="sbcopy">Sao chép mô tả</button><button type="button" data-act="sbzoom">Phóng to</button></span></div>${ws(code)}</figure>`;
    return `<pre class="codeblk"><code>${esc(code)}</code></pre>`;
  }
  const cp=closed&&lang?`<div class="sbbar"><span>${esc(lang)}</span><span><button type="button" data-act="sbcopy">Sao chép</button></span></div>`:'';
  return `<figure class="sbfig codefig" data-src="${esc(code)}">${cp}<pre class="codeblk"><code>${esc(code)}</code></pre></figure>`;
}
function mdFull(src){
  let out='',last=0,m;
  const re=/\x60\x60\x60([A-Za-z]*)[ \t]*\n?([\s\S]*?)(?:\x60\x60\x60|$)/g;
  while((m=re.exec(src))!==null){
    if(m.index>last)out+=mdText(src.slice(last,m.index));
    const closed=m[0].length>=6&&m[0].slice(-3)==='\x60\x60\x60';
    out+=fence(m[1].toLowerCase(),m[2].replace(/\s+$/,''),closed);
    last=re.lastIndex;
  }
  if(last<src.length)out+=mdText(src.slice(last));
  return out;
}

function classify(q,ctx){
  const s=plain(q);
  if(ctx&&ctx.cd===5)return 'scratch';
  if(/scratch|khoi lenh|sprite|nhan vat|con meo|\bmeo\b|repeat|forever|green flag|co xanh|when .* clicked|vong lap|di chuyen|quay (phai|trai)|tro choi|doan so|bat chuot|bam vao|hinh vuong|hinh tam giac|ve hinh/.test(s))return 'scratch';
  if(/python|c\+\+|pascal|java|javascript|html|lap trinh|thuat toan|ma gia|\bcode\b|viet chuong trinh|chuong trinh|bien |vong lap|if else|input|print|\bfor\b|\bwhile\b|gia tri|nhap (vao )?(hai|2|so)/.test(s))return 'code';
  return 'theory';
}
const INTENT={scratch:'Bài Scratch',code:'Lập trình',theory:'Kiến thức'};
function userHint(intent){
  let h='';
  if(intent==='scratch')h='[Ghi chú hệ thống: câu hỏi nhóm A, bài Scratch. Bắt buộc có khối mã scratch hoàn chỉnh trong câu trả lời.]';
  else if(intent==='code')h='[Ghi chú hệ thống: câu hỏi nhóm B, lập trình. Đưa mã nguồn đúng ngôn ngữ và khối scratch tương đương nếu quy đổi được.]';
  else h='[Ghi chú hệ thống: câu hỏi nhóm C, không cần khối Scratch trừ khi học sinh yêu cầu.]';
  if(state.chat.hint)h+=' [Chế độ gợi ý trước: chỉ đưa Hiểu đề, ý tưởng và các bước, kèm khối lệnh còn thiếu chỗ quan trọng để học sinh tự điền. Khối lệnh hoàn chỉnh chỉ đưa khi học sinh yêu cầu.]';

function splitSug(t){
  const i=t.indexOf('@@');
  if(i<0)return {body:t,sug:[]};
  const m=t.slice(i).match(/^@@GOIY:\s*(.*)/);
  return {body:t.slice(0,i).trimEnd(),sug:m?m[1].split('|').map(s=>s.trim()).filter(Boolean).slice(0,3):[]};
}

function growBox(){const t=$('#chatIn');if(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px'}}
function localSearch(q){
  const toks=plain(q).split(/[^a-z0-9]+/).filter(t=>t.length>=3);
  const scored=visLessons().map(l=>{
    const hay=plain(l.title+' '+l.prompt+' '+l.hints.join(' '));
    let s=0;toks.forEach(t=>{if(hay.includes(t))s+=t.length>=5?2:1});
    return {l,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3);
  return scored.map(x=>x.l.id);
}
function sendChat(){
  const box=$('#chatIn');if(!box||state.chat.busy)return;
  const q=box.value.trim();if(!q)return;
  box.value='';state.chat.draft='';growBox();
  sendQ(q,false);
}
async function sendQ(q,regen){
  const c=state.chat;if(c.busy||!q)return;
  let cv=curConv();
  if(!cv){cv={id:uid('c'),title:'Cuộc trò chuyện mới',ts:Date.now(),ctx:c.ctx||null,turns:[]};c.ctx=null;c.convs.unshift(cv);c.cur=cv.id}
  if(!regen){cv.turns.push({role:'user',content:q});const uu=me();if(uu){const ak=store.get('asks',{});ak[uu.id]=(ak[uu.id]||0)+1;store.set('asks',ak)}}
  if(cv.title==='Cuộc trò chuyện mới')cv.title=q.slice(0,40);
  cv.ts=Date.now();saveChat();renderMsgs();refreshList();
  if(state.ai==='pending'&&aiReadyP)await aiReadyP;
  if(!sampleFn){
    const ids=localSearch(q);
    cv.turns.push({role:'assistant',local:true,ids,content:ids.length?'AI chưa dùng được ở chế độ xem này. Đây là các bài có sẵn gần với câu hỏi của bạn:':'AI chưa dùng được ở chế độ xem này, và mình chưa tìm thấy bài nào gần với câu hỏi. Hãy thử từ khóa ngắn hơn, ví dụ “vòng lặp”, “biến”, “SUM”.'});
    saveChat();renderMsgs();return;
  }
  const intent=classify(q,curCtx());
  const hist=cv.turns.filter(t=>!t.err&&!t.local).slice(-10).map(t=>({role:t.role,content:t.content}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  hist[hist.length-1]={role:'user',content:hist[hist.length-1].content+userHint(intent)};
  const input=[{role:'user',content:rules()},...hist];
  setBusy(true);
  appendMsgHTML(`<div class="msg ai" id="liveMsg"><div class="who">Gia sư AI ${chipOf({intent})}</div><div class="think" id="liveThink"><i></i><i></i><i></i><span>Đang suy nghĩ…</span></div><div class="md" id="liveBody"></div></div>`);
  c.ctl=new AbortController();
  const live=t=>{const th=$('#liveThink');if(th)th.remove();const b=$('#liveBody');if(b){b.innerHTML=mdFull(splitSug(t).body);scrollMsgs(false)}};
  try{
    const r=await sampleFn(input,{cache:false,signal:c.ctl.signal,onText:({text})=>live(text)});
    cv.turns.push({role:'assistant',content:r.text,intent});
    saveChat();renderMsgs();
    if(r.truncated)appendMsgHTML(`<div class="msg err">Câu trả lời bị cắt ngắn. Hãy hỏi riêng từng phần để nhận câu trả lời đầy đủ hơn.</div>`);
  }catch(e){
    const code=e&&e.code;
    if(code==='cancelled'){
      if(e.text)cv.turns.push({role:'assistant',content:splitSug(e.text).body+'\n\n(Đã dừng)',intent});
      saveChat();renderMsgs();
    }else{
      let msg='Có lỗi khi gọi AI. Bạn thử gửi lại sau ít phút nhé.';
      if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){
        sampleFn=null;state.ai='none';refreshAIBanner();
        const ids=localSearch(q);
        cv.turns.push({role:'assistant',err:true,content:'Bạn chưa cho phép trang này dùng Claude, hoặc tài khoản chưa dùng được AI. Mình sẽ tìm bài có sẵn thay thế.'});
        cv.turns.push({role:'assistant',local:true,ids,content:ids.length?'Các bài có sẵn gần với câu hỏi của bạn:':'Chưa tìm thấy bài nào gần với câu hỏi.'});
        saveChat();renderMsgs();setBusy(false);c.ctl=null;return;
      }
      else if(code==='rate_limited')msg='Bạn hỏi hơi nhanh hoặc đã dùng hết lượt Claude hiện có. Hãy đợi một lúc rồi hỏi lại.';
      else if(code==='session_expired')msg='Phiên đăng nhập Claude đã hết hạn. Hãy đăng nhập lại Claude rồi hỏi tiếp.';
      else if(code==='refused')msg='AI không trả lời câu hỏi này. Bạn thử diễn đạt lại theo bài Tin học 8 nhé.';
      else if(code==='prompt_too_large')msg='Cuộc trò chuyện đã quá dài. Hãy bấm “Cuộc trò chuyện mới” rồi hỏi lại.';
      cv.turns.push({role:'assistant',err:true,content:msg});
      saveChat();renderMsgs();
    }
  }finally{
    c.ctl=null;setBusy(false);
  }
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Đã sao chép')}
  catch(e){
    try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Đã sao chép')}
    catch(e2){toast('Không sao chép được, hãy bôi đen và copy')}
  }
}

const CM={db:null,uid:null,canWrite:null,mode:'local',inited:false,lastProf:'',err:null,

let _rt=null;
function scheduleRender(){
  clearTimeout(_rt);
  _rt=setTimeout(()=>{
    const a=document.activeElement;
    if(a&&a.closest&&a.closest('#main')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){CM.pending=true;return}
    CM.pending=false;render();
  },160);
}
document.addEventListener('focusout',()=>{if(CM.pending)setTimeout(()=>{if(CM.pending)scheduleRender()},200)});
function cmChanged(){
  if(['gallery','qa','friends','stats','admin','home'].includes(state.route.name))scheduleRender();
  setTimeout(syncProfile,300);
}
async function initCM(){
  try{
    if(!window.claude||typeof window.claude.use!=='function'){CM.inited=true;return}
    const db=await window.claude.use('db');
    if(!db){CM.inited=true;return}
    let user=null;try{user=await window.claude.use('user')}catch(e){}
    try{CM.uid=user&&user.id?await user.id():null}catch(e){}
    try{CM.canWrite=user&&user.can?await user.can('data.write'):null}catch(e){}
    CM.db=db;CM.mode='shared';
    CM_KEYS.forEach(k=>{CM.d[k]={}});
    CM_KEYS.forEach(k=>{
      db.collection(k).onSnapshot(s=>{const o={};s.docs.forEach(x=>{o[x.id]=x.data()});CM.d[k]=o;cmChanged()},e=>{CM.err=e&&e.code});
    });
  }catch(e){}
  CM.inited=true;
  if(state.route.name!=='ask')scheduleRender();
}
function cmFail(e){
  const c=e&&e.code;
  toast(c==='invalid_argument'?'Chưa lưu được. Tài khoản của bạn có thể chỉ được xem, hãy nhờ thầy cô cấp quyền cho bạn.':c==='quota_exceeded'?'Kho dữ liệu đã đầy. Hãy báo giáo viên.':'Chưa lưu được, bạn thử lại sau nhé.');
}
async function cmSet(c,id,o){
  CM.d[c]={...CM.d[c],[id]:o};
  if(CM.db){try{await CM.db.doc(c+'/'+id).set(o)}catch(e){cmFail(e);return false}}
  else store.set('cm_'+c,CM.d[c]);
  scheduleRender();return true;
}
async function cmPatch(c,id,p){const o=CM.d[c][id];if(!o)return false;return cmSet(c,id,{...o,...p})}
async function cmDel(c,id){
  const n={...CM.d[c]};delete n[id];CM.d[c]=n;
  if(CM.db){try{await CM.db.doc(c+'/'+id).delete()}catch(e){cmFail(e);return false}}
  else store.set('cm_'+c,CM.d[c]);
  scheduleRender();return true;
}

/* ---- profile sync ---- */
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const friendsOf=l=>cmRows('friends').filter(f=>f.s==='ok'&&(f.from===l||f.to===l)).map(f=>f.from===l?f.to:f.from);
function statsOf(u){
  const d=doneOf(u.id),all=visLessons();
  const done=all.filter(l=>d[l.id]).length;
  const sc=all.filter(l=>l.cd===5),scDone=sc.filter(l=>d[l.id]).length;
  const debug=all.filter(l=>l.prob&&d[l.id]).length;
  const t=(store.get('time',{})[u.id])||{};
  const mins=Math.round(Object.values(t).reduce((a,b)=>a+b,0)/60);
  const days=new Set();Object.entries(t).forEach(([k,v])=>{if(v>=60)days.add(k)});
  Object.values(d).forEach(ts=>days.add(dayKey(new Date(ts))));
  let streak=0;const c=new Date();if(!days.has(dayKey(c)))c.setDate(c.getDate()-1);
  while(days.has(dayKey(c))){streak++;c.setDate(c.getDate()-1)}
  const asks=(store.get('asks',{})[u.id])||0;
  const posts=cmRows('gallery').filter(g=>g.a===u.login).length;
  const answers=cmRows('answers').filter(a=>a.a===u.login).length;
  const friends=friendsOf(u.login).length;
  const ent=Object.entries(d).sort((a,b)=>b[1]-a[1])[0];
  const lastL=ent?lessonsAll().find(l=>l.id===ent[0]):null;
  const s={done,total:all.length,sc:sc.length,scDone,debug,mins,streak,asks,posts,answers,friends,t,last:lastL?{id:lastL.id,title:lastL.title}:null};
  s.badgeIds=BADGES.filter(b=>b.test(s)).map(b=>b.id);
  return s;
}
const BADGES=[
  {id:'first',name:'Bài đầu tiên',desc:'Hoàn thành 1 bài',ic:'rocket',test:s=>s.done>=1},
  {id:'sc5',name:'Thợ Scratch',desc:'Hoàn thành 5 bài Scratch',ic:'cd5',test:s=>s.scDone>=5},
  {id:'scall',name:'Bậc thầy Scratch',desc:'Hoàn thành mọi bài Scratch',ic:'cd5',test:s=>s.sc>0&&s.scDone>=s.sc},
  {id:'debug',name:'Thám tử gỡ lỗi',desc:'Hoàn thành một bài gỡ lỗi',ic:'cd2',test:s=>s.debug>=1},
  {id:'streak3',name:'Chuỗi 3 ngày',desc:'Học 3 ngày liên tiếp',ic:'cd4',test:s=>s.streak>=3},
  {id:'time60',name:'Chăm chỉ',desc:'Học tổng cộng 60 phút',ic:'cd1',test:s=>s.mins>=60},
  {id:'ask1',name:'Hỏi AI lần đầu',desc:'Gửi câu hỏi đầu tiên cho gia sư AI',ic:'chat',test:s=>s.asks>=1},
  {id:'post1',name:'Nhà sáng tạo',desc:'Đăng dự án đầu tiên lên Gallery',ic:'rocket',test:s=>s.posts>=1},
  {id:'help1',name:'Người giúp đỡ',desc:'Trả lời một câu hỏi trong Hỏi đáp',ic:'cd3',test:s=>s.answers>=1},
  {id:'friend1',name:'Bạn đồng hành',desc:'Kết bạn với một bạn',ic:'user',test:s=>s.friends>=1}
];
function checkBadges(){
  const u=me();if(!u||u.role==='admin')return;
  const s=statsOf(u),all=store.get('badges',{}),mine=all[u.id]||{};
  const fresh=BADGES.filter(b=>b.test(s)&&!mine[b.id]);
  if(!fresh.length)return;
  fresh.forEach(b=>{mine[b.id]=Date.now()});all[u.id]=mine;store.set('badges',all);
  if(store.get('badgeInit_'+u.id,false)||fresh.length<=2){setTimeout(()=>toast(fresh.length===1?'Huy hiệu mới: '+fresh[0].name:'Bạn nhận '+fresh.length+' huy hiệu mới!'),400)}
  store.set('badgeInit_'+u.id,true);
}
async function syncProfile(){
  const u=me();if(!u||u.role==='admin'||!CM.inited)return;
  const old=CM.d.profiles[u.login];
  if(old&&old.uid&&CM.uid&&old.uid!==CM.uid)return;
  const s=statsOf(u);
  const p={login:u.login,name:firstName(u.name),cls:u.cls||'',uid:CM.uid||(old&&old.uid)||null,share:!!u.share};
  if(u.share){p.done=s.done;p.total=s.total;p.streak=s.streak;p.badges=s.badgeIds.length;p.last=s.last}
  const key=JSON.stringify(p);
  if(CM.lastProf===key)return;
  CM.lastProf=key;
  await cmSet('profiles',u.login,{...p,ts:Date.now()});
}

function useOf(cat,code){const k=Object.keys(USE_ONE).find(x=>code.startsWith(x));return k?USE_ONE[k]:USE[cat.k]}
function exampleOf(code){
  const first=code.trim()[0];
  if(code.startsWith('when '))return code+'\nsay [Xin chào!] for (2) seconds';
  if(first==='(')return 'when @greenFlag clicked\nsay '+code+' for (2) seconds';
  if(first==='<')return 'when @greenFlag clicked\nif '+code+' then\n  say [Đúng rồi!] for (2) seconds\nend';
  return 'when @greenFlag clicked\n'+code;
}
const lblOf=c=>String(c).split('\n')[0].replace(/\[[^\]]*\]|\([^)]*\)|<[^>]*>|@\w+/g,'').replace(/[()<>\[\]?]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
let _lessonLbl=null;
function lessonsUsing(code){
  const lb=lblOf(code);if(lb.length<3||/^(when|end|else)$/.test(lb))return [];
  if(!_lessonLbl||_lessonLbl.n!==lessonsAll().length){
    _lessonLbl={n:lessonsAll().length,m:lessonsAll().filter(l=>l.visible&&/scratch/.test(l.type||'scratch')&&l.code).map(l=>({l,set:new Set(String(l.code).split('\n').map(x=>lblOf(x.trim())))}))};
  }
  return _lessonLbl.m.filter(x=>x.set.has(lb)).map(x=>x.l).slice(0,4);
}
function dictItems(){
  const D=state.dict,q=plain(D.q),favs=store.get('favblocks',[]);
  const out=[];
  PAL.forEach(cat=>cat.items.forEach(([code,vi])=>{
    if(D.cat!=='all'&&D.cat!==cat.k)return;
    if(D.fav&&!favs.includes(code))return;
    if(q&&!plain(code+' '+vi+' '+cat.name+' '+cat.vi).includes(q))return;
    out.push({cat,code,vi});
  }));
  return out;
}

      ${u?`<form class="f" data-form="qans" data-id="${open.id}" style="margin-top:14px" novalidate>${field('a_text','Câu trả lời của bạn','<textarea id="a_text" name="text" maxlength="500"></textarea>')}<button class="btn primary" type="submit">Gửi trả lời</button></form>`
        :`<p class="help" style="margin-top:12px"><button class="crumb" style="text-decoration:underline" data-act="authgo" data-tab="login">Đăng nhập</button> để trả lời.</p>`}</div>`;
  }
  const list=qs.map(q=>{const n=answers.filter(a=>a.qid===q.id).length;
    return `<button class="card qrow" data-act="qopen" data-id="${q.id}"><span class="qt"><b>${esc(q.title)}</b><span class="help">${esc(q.n)} · ${fmtDate(q.ts)}</span></span><span class="qm"><span class="pill">${tagName(q.tag)}</span>${q.best?'<span class="pill ok">Đã giải đáp</span>':''}<span class="help">${n} trả lời</span></span></button>`}).join('');
  return `<div class="view wrap" style="padding-block:40px">
    <div class="head"><span class="eyebrow">Hỏi đáp</span><h1 style="font-size:clamp(1.9rem,4.5vw,2.8rem)">Hỏi nhanh, giúp nhau</h1><p class="lead">Kẹt ở chỗ nhỏ? Hỏi ngắn gọn, gắn thẻ chủ đề để các bạn dễ tìm.</p></div>
    ${cmBanner()}
    ${open?detail:`<div class="row" style="justify-content:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      ${u?`<button class="btn primary" data-act="qform">+ Đặt câu hỏi</button>`:`<button class="btn" data-act="authgo" data-tab="login">Đăng nhập để hỏi</button>`}
      <input id="qsearch" type="search" placeholder="Tìm câu hỏi" value="${esc(Q.q)}" aria-label="Tìm câu hỏi" style="max-width:260px"></div>
      <div class="chips" style="margin-bottom:16px"><button class="chip" data-act="qtag" data-v="" aria-pressed="${!Q.tag}">Tất cả</button>${TAGS.map(t=>`<button class="chip" data-act="qtag" data-v="${t[0]}" aria-pressed="${Q.tag===t[0]}">${t[1]}</button>`).join('')}</div>
      ${form}<div class="qlist">${list||'<div class="empty">Chưa có câu hỏi nào trong mục này.</div>'}</div>`}</div>`;
}

function friendsPage(){
  const u=me();
  if(!u)return `<div class="view wrap" style="padding-block:40px"><div class="empty">Đăng nhập để kết bạn và xem tiến độ. <button class="crumb" data-act="authgo" data-tab="login">Đăng nhập</button></div></div>`;

  const F=cmRows('friends'),P=CM.d.profiles;
  const ok=friendsOf(u.login);
  const incoming=F.filter(f=>f.s==='pending'&&f.to===u.login),outgoing=F.filter(f=>f.s==='pending'&&f.from===u.login);
  const known=new Set([u.login,...ok,...incoming.map(f=>f.from),...outgoing.map(f=>f.to)]);
  const classmates=Object.values(P).filter(p=>p.login&&!known.has(p.login)&&p.cls&&p.cls===u.cls).slice(0,8);

      <p class="help">Đã học ${p.done||0}/${p.total||0} bài · chuỗi ${p.streak||0} ngày · ${p.badges||0} huy hiệu</p>
      <p class="help">${p.last?'Bài gần nhất: '+esc(p.last.title):'Chưa học bài nào'}</p>`:'<p class="help">Bạn này chưa chia sẻ tiến độ.</p>';

  return `<div class="view wrap" style="padding-block:40px">
    <div class="head"><span class="eyebrow">Bạn bè</span><h1 style="font-size:clamp(1.9rem,4.5vw,2.8rem)">Học cùng bạn bè</h1><p class="lead">Thêm bạn, xem bạn đang học đến đâu và cùng cố gắng. Không có bảng xếp hạng.</p></div>
    ${cmBanner()}
    <div class="split">
      <div class="card"><h3 style="margin-bottom:8px">Mã bạn bè của bạn</h3>
        <p><code class="fcode">${esc(u.login)}</code> <button class="btn small" data-act="fcopy">Sao chép</button></p>
        <label class="check" style="margin-top:12px"><input type="checkbox" id="shareProg" ${u.share?'checked':''}><span>Cho bạn bè xem tiến độ học của mình (bài đã học, chuỗi ngày, huy hiệu). Không hiện email hay mật khẩu.</span></label></div>
      <div class="card"><h3 style="margin-bottom:8px">Thêm bạn</h3>
        <form class="cform" data-form="fadd"><input name="login" maxlength="40" placeholder="Nhập tên đăng nhập của bạn" aria-label="Tên đăng nhập của bạn bè" autocapitalize="off"><button class="btn primary small" type="submit">Gửi lời mời</button></form>
        ${classmates.length?`<p class="help" style="margin-top:12px">Bạn cùng lớp ${esc(u.cls)}:</p><div class="chips">${classmates.map(p=>`<button class="chip" data-act="fquick" data-id="${esc(p.login)}">+ ${esc(p.name)}</button>`).join('')}</div>`:''}</div></div>
    ${incoming.length?`<h2 style="font-size:1.3rem;margin:24px 0 10px">Lời mời đến</h2><div class="grid g3">${incoming.map(f=>`<div class="card fr"><b>${pname(f.from)}</b><div class="cta"><button class="btn small primary" data-act="facc" data-id="${esc(f.from)}">Đồng ý</button><button class="btn small" data-act="funf" data-id="${esc(f.from)}">Từ chối</button></div></div>`).join('')}</div>`:''}
    <h2 style="font-size:1.3rem;margin:24px 0 10px">Bạn bè (${ok.length})</h2>
    <div class="grid g3">${ok.map(fcard).join('')||'<div class="empty">Chưa có bạn bè nào. Gửi lời mời bằng tên đăng nhập.</div>'}</div>
    ${outgoing.length?`<h2 style="font-size:1.3rem;margin:24px 0 10px">Đã gửi lời mời</h2><div class="grid g3">${outgoing.map(f=>`<div class="card fr"><b>${pname(f.to)}</b><p class="help">Đang chờ đồng ý</p><button class="btn small" data-act="funf" data-id="${esc(f.to)}">Hủy lời mời</button></div>`).join('')}</div>`:''}</div>`;
}
async function sendFriend(login){
  const u=me();if(!u||!rate('friend',6))return;
  const l=norm(login);
  if(!l||l===u.login){toast('Nhập tên đăng nhập của bạn bè (không phải của bạn).');return}
  if(!CM.d.profiles[l]){toast('Không tìm thấy tên đăng nhập này. Bạn đó cần đăng nhập vào web ít nhất một lần.');return}
  const F=cmRows('friends');
  if(F.some(f=>f.s==='ok'&&((f.from===u.login&&f.to===l)||(f.from===l&&f.to===u.login)))){toast('Hai bạn đã là bạn bè.');return}
  const rev=F.find(f=>f.from===l&&f.to===u.login&&f.s==='pending');
  if(rev){await cmSet('friends',rev.id,{from:rev.from,to:rev.to,s:'ok',ts:Date.now()});toast('Hai bạn đã kết bạn!');return}
  if(F.some(f=>f.from===u.login&&f.to===l)){toast('Bạn đã gửi lời mời rồi.');return}
  if(await cmSet('friends',u.login+'__'+l,{from:u.login,to:l,s:'pending',ts:Date.now()}))toast('Đã gửi lời mời kết bạn');
}

/* ================= community actions ================= */
async function commSubmit(kind,f,fd){
  const u=me();
  if(kind==='gpost'){
    if(!u)return needLogin(),true;
    let ok=true;
    const title=clean(fd.title,80),desc=clean(fd.desc,240),code=String(fd.code||'').replace(/\r/g,'').slice(0,1500).trim(),link=clean(fd.link,300);
    if(title.length<3)ok=bad(f,'g_title','Tên dự án ít nhất 3 ký tự.');
    if(link&&!/^https:\/\/\S+$/.test(link))ok=bad(f,'g_link','Chỉ nhận liên kết bắt đầu bằng https://');
    if(dirty(title+' '+desc))ok=bad(f,'g_desc','Nội dung có từ chưa phù hợp, hãy sửa lại nhé.');
    if(!ok){firstBad(f);return true}
    if(!rate('gpost',3,300000))return true;
    const id=uid('g_');
    if(await cmSet('gallery',id,{title,desc,code,link,a:u.login,n:dn(u),ts:Date.now(),approved:u.role==='admin',hidden:false})){state.g.form=false;toast(u.role==='admin'?'Đã đăng dự án':'Đã gửi dự án, chờ giáo viên duyệt');render()}
    return true;
  }
  if(kind==='gcmt'){
    if(!u)return needLogin(),true;
    const text=clean(fd.text,200);if(text.length<1)return true;
    if(dirty(text)){toast('Bình luận có từ chưa phù hợp, hãy sửa lại nhé.');return true}
    if(!rate('cmt',5))return true;
    await cmSet('comments',uid('c_'),{pid:f.dataset.id,a:u.login,n:dn(u),text,ts:Date.now(),hidden:false});
    return true;
  }
  if(kind==='qask'){
    if(!u)return needLogin(),true;
    const title=clean(fd.title,120),body=clean(fd.body,500);
    if(title.length<5){bad(f,'q_title','Câu hỏi ít nhất 5 ký tự.');firstBad(f);return true}
    if(dirty(title+' '+body)){bad(f,'q_title','Nội dung có từ chưa phù hợp, hãy sửa lại nhé.');return true}
    if(!rate('qask',3,300000))return true;
    const id=uid('q_');
    if(await cmSet('qa',id,{title,body,tag:fd.tag||'other',a:u.login,n:dn(u),ts:Date.now(),hidden:false,best:null})){state.qa.form=false;state.qa.open=id;toast('Đã đăng câu hỏi');render()}
    return true;
  }
  if(kind==='qans'){
    if(!u)return needLogin(),true;
    const text=clean(fd.text,500);
    if(text.length<2){bad(f,'a_text','Hãy viết câu trả lời.');return true}
    if(dirty(text)){bad(f,'a_text','Nội dung có từ chưa phù hợp, hãy sửa lại nhé.');return true}
    if(!rate('ans',5))return true;
    if(await cmSet('answers',uid('a_'),{qid:f.dataset.id,text,a:u.login,n:dn(u),ts:Date.now(),hidden:false})){f.reset();toast('Đã gửi trả lời')}
    return true;
  }
  if(kind==='fadd'){if(!u)return needLogin(),true;await sendFriend(fd.login);f.reset();return true}
  return false;
}
function commClick(a,el,id){
  const u=me(),C=el.dataset.c;
  switch(a){
    case 'dcat':state.dict.cat=el.dataset.v;render();return true;
    case 'dopen':{const k=el.dataset.i;state.dict.open[k]=!state.dict.open[k];const l=$('#dlist');if(l)l.innerHTML=dictList();return true}
    case 'dfav':{const k=el.dataset.i,f=store.get('favblocks',[]);store.set('favblocks',f.includes(k)?f.filter(x=>x!==k):[...f,k]);const l=$('#dlist');if(l)l.innerHTML=dictList();return true}
    case 'dask':{const k=el.dataset.i;state.chat.cur=null;state.chat.ctx=null;state.chat.draft='Giải thích khối “'+lblOf(k)+'” trong Scratch: dùng khi nào và cho mình một ví dụ nhỏ.';go('ask');const t=$('#chatIn');if(t){growBox();t.focus()}return true}
    case 'gform':if(needLogin())return true;state.g.form=!state.g.form;render();return true;
    case 'gsort':state.g.sort=el.dataset.v;render();return true;
    case 'gopen':state.g.open=state.g.open===id?null:id;render();return true;
    case 'gheart':toggleReact('p',id);return true;
    case 'gdel':{if(!twice(el,'Bấm lại để xóa'))return true;const g=CM.d.gallery[id];if(g&&u&&(g.a===u.login||canMod()))cmDel('gallery',id);return true}
    case 'gappr':if(canMod())cmPatch('gallery',id,{approved:!(CM.d.gallery[id]||{}).approved,reported:false});return true;
    case 'ghide':if(canMod())cmPatch('gallery',id,{hidden:!(CM.d.gallery[id]||{}).hidden});return true;
    case 'delcmt':{const c=CM.d.comments[id];if(c&&u&&(c.a===u.login||canMod()))cmDel('comments',id);return true}
    case 'hidecmt':if(canMod())cmPatch('comments',id,{hidden:!(CM.d.comments[id]||{}).hidden});return true;
    case 'report':{if(!u){needLogin();return true}if(CM.d[C]&&CM.d[C][id]){cmPatch(C,id,{reported:true});toast('Đã báo cho giáo viên. Cảm ơn bạn!')}return true}
    case 'adhide':if(canMod())cmPatch(C,id,{hidden:true,reported:false});return true;
    case 'adok':if(canMod())cmPatch(C,id,{reported:false});return true;
    case 'addel':if(canMod()&&twice(el,'Bấm lại để xóa'))cmDel(C,id);return true;
    case 'qform':if(needLogin())return true;state.qa.form=!state.qa.form;render();return true;
    case 'qtag':state.qa.tag=el.dataset.v;render();return true;
    case 'qopen':state.qa.open=id;state.qa.form=false;render();window.scrollTo(0,0);return true;
    case 'qclose':state.qa.open=null;render();return true;
    case 'qdel':{if(!twice(el,'Bấm lại để xóa'))return true;const q=CM.d.qa[id];if(q&&u&&(q.a===u.login||canMod())){state.qa.open=null;cmDel('qa',id)}return true}
    case 'adel':{const x=CM.d.answers[id];if(x&&u&&(x.a===u.login||canMod()))cmDel('answers',id);return true}
    case 'ahide':if(canMod())cmPatch('answers',id,{hidden:!(CM.d.answers[id]||{}).hidden});return true;
    case 'qthanks':toggleReact('a',id);return true;
    case 'qbest':{const an=CM.d.answers[id];if(!an)return true;const q=CM.d.qa[an.qid];if(q&&u&&(q.a===u.login||canMod()))cmPatch('qa',an.qid,{best:q.best===id?null:id});return true}
    case 'qai':{const q=CM.d.qa[id];if(!q)return true;state.chat.cur=null;state.chat.ctx=null;state.chat.draft=q.title+(q.body?'\n'+q.body:'');go('ask');const t=$('#chatIn');if(t){growBox();t.focus()}return true}
    case 'fcopy':if(u)copyText(u.login);return true;
    case 'fquick':sendFriend(id);return true;
    case 'facc':{const f=CM.d.friends[id+'__'+(u&&u.login)];if(f)cmSet('friends',id+'__'+u.login,{...f,s:'ok',ts:Date.now()}).then(()=>toast('Hai bạn đã kết bạn!'));return true}
    case 'funf':{if(!u)return true;const k1=id+'__'+u.login,k2=u.login+'__'+id;if(CM.d.friends[k1])cmDel('friends',k1);if(CM.d.friends[k2])cmDel('friends',k2);return true}
  }
  return false;
}
