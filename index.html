/* ---------- forms ---------- */
function clearErr(f){f.querySelectorAll('.err').forEach(e=>e.textContent='');f.querySelectorAll('[aria-invalid]').forEach(e=>e.removeAttribute('aria-invalid'))}
function bad(f,id,msg){const e=f.querySelector('#e_'+id);if(e)e.textContent=msg;const i=f.querySelector('#'+id);if(i)i.setAttribute('aria-invalid','true');return false}
function firstBad(f){const i=f.querySelector('[aria-invalid="true"]');if(i)i.focus()}

async function onSubmit(e){
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  if(f.dataset.form==='chat'){sendChat();return}
  clearErr(f);
  const fd=Object.fromEntries(new FormData(f).entries());
  const kind=f.dataset.form;
  if(await commSubmit(kind,f,fd))return;

  if(kind==='login'){
    const lg=norm(fd.login);let ok=true;
    if(!lg)ok=bad(f,'l_login','Nhập tên đăng nhập.');
    if(!fd.pw)ok=bad(f,'l_pw','Nhập mật khẩu.');
    if(!ok)return firstBad(f);
    const u=users().find(x=>x.login===lg);
    const h=u?await hashPw(fd.pw,u.id):'';
    if(!u||u.hash!==h){$('#e_l_form').textContent='Sai tên đăng nhập hoặc mật khẩu. Kiểm tra lại nhé.';return}
    if(u.locked){$('#e_l_form').textContent='Tài khoản đang bị khóa. Hãy liên hệ giáo viên.';return}
    store.set('session',u.id);state.note='';
    toast('Đăng nhập thành công');
    go(u.mustChange?'account':(u.role==='admin'?'admin':'lessons'));
  }
  else if(kind==='register'){
    const lg=norm(fd.login);let ok=true;
    const cls=String(fd.cls||'').trim().toUpperCase();
    if(String(fd.name||'').trim().length<2)ok=bad(f,'r_name','Nhập họ và tên (ít nhất 2 ký tự).');
    if(!/^[a-z0-9_.]{3,20}$/.test(lg))ok=bad(f,'r_login','Tên đăng nhập 3 đến 20 ký tự: chữ không dấu, số, dấu _ hoặc dấu chấm.');
    else if(/^(admin|giaovien|teacher|root)$/.test(lg)||users().some(x=>x.login===lg))ok=bad(f,'r_login','Tên đăng nhập này đã có người dùng, hãy chọn tên khác.');
    else{const pr=CM.d.profiles[lg];if(pr&&pr.uid&&CM.uid&&pr.uid!==CM.uid)ok=bad(f,'r_login','Tên đăng nhập này đã có người dùng, hãy chọn tên khác.');}
    if(!/^8\S{0,5}$/.test(cls))ok=bad(f,'r_class','Nhập tên lớp bắt đầu bằng số 8, ví dụ 8A.');
    if(!strong(fd.pw||''))ok=bad(f,'r_pw','Mật khẩu cần ít nhất 8 ký tự, gồm cả chữ và số.');
    if(fd.pw!==fd.pw2)ok=bad(f,'r_pw2','Hai mật khẩu chưa giống nhau.');
    if(!fd.ok)ok=bad(f,'r_ok','Bạn cần đồng ý với chính sách bảo mật.');
    if(!ok)return firstBad(f);
    const id=uid('u_');const us=users();
    us.push({id,name:fd.name.trim(),login:lg,grade:'8',cls,role:'student',share:false,hash:await hashPw(fd.pw,id),locked:false,created:Date.now()});
    store.set('users',us);store.set('session',id);
    toast('Chào mừng bạn đến với CodeTHCS!');go('lessons');
  }
  else if(kind==='forgot'){
    const lg=norm(fd.login);
    if(!lg){bad(f,'f_login','Nhập tên đăng nhập.');return firstBad(f)}
    const us=users(),u=us.find(x=>x.login===lg&&x.role==='student');
    if(u){u.resetRequested=true;store.set('users',us)}
    const d=$('#f_done');d.hidden=false;d.textContent='Đã ghi nhận yêu cầu. Nếu tài khoản tồn tại, giáo viên sẽ cấp mật khẩu tạm cho bạn. Hãy nhắn thầy cô để được xử lý nhanh.';
  }
  else if(kind==='chpw'){
    const u=me();let ok=true;
    if(!u)return;
    if(!fd.old)ok=bad(f,'c_old','Nhập mật khẩu hiện tại.');
    if(!strong(fd.pw||''))ok=bad(f,'c_new','Mật khẩu mới cần ít nhất 8 ký tự, gồm cả chữ và số.');
    if(fd.pw!==fd.pw2)ok=bad(f,'c_new2','Hai mật khẩu chưa giống nhau.');
    if(!ok)return firstBad(f);
    if(u.hash!==await hashPw(fd.old,u.id)){bad(f,'c_old','Mật khẩu hiện tại chưa đúng.');return firstBad(f)}
    const us=users(),x=us.find(a=>a.id===u.id);x.hash=await hashPw(fd.pw,u.id);x.mustChange=false;x.resetRequested=false;store.set('users',us);
    toast('Đã đổi mật khẩu');render();
  }
  else if(kind==='contact'){
    let ok=true;
    if(String(fd.name||'').trim().length<2)ok=bad(f,'m_name','Nhập họ và tên.');
    if(!validLogin(norm(fd.email)))ok=bad(f,'m_email','Email hoặc số điện thoại chưa đúng định dạng.');
    if(String(fd.msg||'').trim().length<5)ok=bad(f,'m_msg','Nội dung quá ngắn.');
    if(!ok)return firstBad(f);
    const m=msgs();m.push({id:uid('m_'),name:fd.name.trim(),email:fd.email.trim(),msg:fd.msg.trim(),time:Date.now()});store.set('msgs',m);
    f.reset();toast('Đã gửi tin nhắn tới giáo viên');
  }
  else if(kind==='proj'){
    const u=me();let ok=true;if(!u)return;
    if(String(fd.title||'').trim().length<3)ok=bad(f,'p_title','Tên dự án cần ít nhất 3 ký tự.');
    if(String(fd.desc||'').trim().length<10)ok=bad(f,'p_desc','Mô tả cần ít nhất 10 ký tự.');
    if(fd.link&&!/^https:\/\/\S+$/.test(fd.link.trim()))ok=bad(f,'p_link','Liên kết phải bắt đầu bằng https://');
    if(!ok)return firstBad(f);
    const ps=projects();
    ps.unshift({id:uid('p_'),uid:u.id,author:u.name,grade:u.cls||u.grade,title:fd.title.trim(),topic:Number(fd.topic)||5,desc:fd.desc.trim(),link:(fd.link||'').trim(),vis:fd.vis,approved:false,sample:false,created:Date.now()});
    store.set('projects',ps);state.editing=null;
    toast(fd.vis==='public'?'Đã gửi. Dự án sẽ hiện sau khi giáo viên duyệt':'Đã lưu dự án riêng tư');render();
  }
  else if(kind==='lesson'){
    if(!isAdmin())return;let ok=true;
    const hints=String(fd.hints||'').split('\n').map(s=>s.trim()).filter(Boolean);
    if(String(fd.title||'').trim().length<3)ok=bad(f,'a_title','Nhập tên bài.');
    if(String(fd.prompt||'').trim().length<5)ok=bad(f,'a_prompt','Nhập đề bài.');
    if(!hints.length)ok=bad(f,'a_hints','Cần ít nhất một gợi ý.');
    if(!String(fd.code||'').trim())ok=bad(f,'a_code','Nhập lời giải mẫu.');
    if(fd.video&&!/^https:\/\/\S+$/.test(fd.video.trim()))ok=bad(f,'a_video','Liên kết video phải bắt đầu bằng https://');
    if(!ok)return firstBad(f);
    const L=lessonsAll();
    const rec={title:fd.title.trim(),cd:Number(fd.cd)||5,bai:(fd.bai||'').trim()||'Bài',level:fd.level,type:fd.type,prompt:fd.prompt.trim(),hints,code:String(fd.code||'').replace(/\s+$/,''),prob:String(fd.prob||'').replace(/\s+$/,''),explain:(fd.explain||'').trim(),video:(fd.video||'').trim(),visible:!!fd.visible};
    if(state.editing==='new')L.push({id:uid('l_'),...rec});
    else{const i=L.findIndex(x=>x.id===state.editing);if(i>=0)L[i]={...L[i],...rec}}
    store.set('lessons',L);state.editing=null;toast('Đã lưu bài tập');render();
  }
}

/* ---------- clicks ---------- */
function onClick(e){
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(commClick(a,el,id))return;
  switch(a){
    case 'go':go(el.dataset.go,id);break;
    case 'authgo':state.authTab=el.dataset.tab;state.note='';go('auth');break;
    case 'authtab':state.authTab=el.dataset.tab;render();break;
    case 'theme':toggleTheme();break;
    case 'menu':{const n=$('#nav');const o=n.classList.toggle('open');el.setAttribute('aria-expanded',String(o));break}
    case 'logout':store.set('session',null);toast('Đã đăng xuất');go('home');break;
    case 'topicgo':state.filter={cd:el.dataset.v,q:''};go('lessons');break;
    case 'topic':state.filter.cd=el.dataset.v;updateList();break;
    case 'paltab':state.palTab=el.dataset.v;render();break;
    case 'hint':{const l=lessonsAll().find(x=>x.id===id);const s=state.show[id];if(s&&s.hints<l.hints.length){s.hints++;render()}break}
    case 'showcode':state.show[id].code=true;render();break;
    case 'copy':{
      const l=lessonsAll().find(x=>x.id===id);
      const fallback=()=>{const p=$('#codeblock');if(p){const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Đã chọn nội dung, hãy nhấn Ctrl+C để sao chép')};
      try{navigator.clipboard.writeText(l.code).then(()=>toast('Đã sao chép'),fallback)}catch(err){fallback()}
      break}
    case 'learn':{
      const u=me();
      if(!u){state.authTab='login';state.note='Đăng nhập để lưu tiến độ học của bạn.';go('auth');break}
      const p=progressAll();p[u.id]=p[u.id]||{};
      if(p[u.id][id]){delete p[u.id][id];toast('Đã bỏ đánh dấu')}else{p[u.id][id]=Date.now();toast('Giỏi lắm! Đã đánh dấu bài đã học');sparks(el)}
      store.set('progress',p);render();break}
    case 'askabout':{
      const l=lessonsAll().find(x=>x.id===id);if(!l)break;
      loadConvs();
      state.chat.cur=null;state.chat.ctx=id;
      state.chat.draft=`Mình đang làm bài “${l.title}”. Đề bài: ${l.prompt}\nMình bị kẹt ở bước: `;
      go('ask');
      const t=$('#chatIn');if(t){growBox();t.focus();t.setSelectionRange(t.value.length,t.value.length)}
      break}
    case 'clearctx':{const cv=curConv();if(cv)cv.ctx=null;else state.chat.ctx=null;const t=$('#chatIn');if(t)state.chat.draft=t.value;saveChat();render();break}
    case 'suggest':{const t=$('#chatIn');if(t){t.value=SUGGEST[+el.dataset.i]||'';sendChat()}break}
    case 'fq':{const cv=curConv();if(!cv||state.chat.busy)break;const last=cv.turns[cv.turns.length-1];const s=last&&splitSug(last.content).sug[+el.dataset.i];if(s)sendQ(s,false);break}
    case 'stopchat':if(state.chat.ctl)state.chat.ctl.abort();break;
    case 'newchat':if(state.chat.busy)break;state.chat.cur=null;state.chat.ctx=null;state.chat.draft='';state.chat.sb=false;render();{const t=$('#chatIn');if(t)t.focus()}break;
    case 'openconv':if(state.chat.busy)break;state.chat.cur=id;state.chat.sb=false;state.chat.draft='';render();break;
    case 'renconv':state.chat.ren=id;refreshList();{const t=$('#renIn');if(t){t.focus();t.select()}}break;
    case 'delconv':{if(!twice(el,'Xóa?'))break;if(state.chat.busy)break;state.chat.convs=state.chat.convs.filter(x=>x.id!==id);if(state.chat.cur===id)state.chat.cur=null;saveChat();render();break}
    case 'csb':state.chat.sb=!state.chat.sb;{const a=$('#chatapp');if(a)a.classList.toggle('sbopen',state.chat.sb)}break;
    case 'copymsg':{const cv=curConv();const m=cv&&cv.turns[+el.dataset.i];if(m)copyText(splitSug(m.content).body);break}
    case 'regen':{const cv=curConv();if(!cv||state.chat.busy)break;while(cv.turns.length&&cv.turns[cv.turns.length-1].role!=='user')cv.turns.pop();const q=cv.turns.length?cv.turns[cv.turns.length-1].content:'';if(q)sendQ(q,true);break}
    case 'editmsg':{const cv=curConv();if(!cv||state.chat.busy)break;const i=+el.dataset.i;const m=cv.turns[i];if(!m)break;cv.turns=cv.turns.slice(0,i);saveChat();renderMsgs();const t=$('#chatIn');if(t){t.value=m.content;state.chat.draft=m.content;growBox();t.focus()}break}
    case 'sbcopy':{const f=el.closest('[data-src]');if(f)copyText(f.dataset.src);break}
    case 'sbzoom':{const f=el.closest('.sbfig');if(f){const z=f.classList.toggle('zoom');el.textContent=z?'Thu nhỏ':'Phóng to'}break}
    case 'newproj':state.editing='proj';render();break;
    case 'cancel':state.editing=null;render();break;
    case 'delproj':{if(!twice(el,'Bấm lại để xóa'))break;
      const u=me(),ps=projects(),p=ps.find(x=>x.id===id);
      if(p&&u&&(isAdmin()||p.uid===u.id)){store.set('projects',ps.filter(x=>x.id!==id));toast('Đã xóa dự án');render()}break}
    /* admin */
    case 'admintab':state.adminTab=el.dataset.tab;state.editing=null;render();break;
    case 'newlesson':state.editing='new';render();break;
    case 'editlesson':state.editing=id;render();{const t=$('#a_title');if(t)t.scrollIntoView({block:'center'})}break;
    case 'prevblocks':{const c=$('#a_code'),ty=$('#a_type'),p=$('#a_prev');if(c&&p){p.innerHTML=ty&&ty.value==='scratch'?ws(c.value||'when @greenFlag clicked'):'<p class="help">Chỉ xem trước được loại Khối lệnh Scratch.</p>'}break}
    case 'togglelesson':{if(!isAdmin())break;const L=lessonsAll(),l=L.find(x=>x.id===id);l.visible=!l.visible;store.set('lessons',L);render();break}
    case 'dellesson':{if(!isAdmin()||!twice(el,'Bấm lại để xóa'))break;store.set('lessons',lessonsAll().filter(x=>x.id!==id));toast('Đã xóa bài tập');render();break}
    case 'resetpw':{if(!isAdmin())break;
      const us=users(),u=us.find(x=>x.id===id);
      const pw='ct'+Math.floor(100000+Math.random()*900000);
      hashPw(pw,id).then(h=>{u.hash=h;u.mustChange=true;u.resetRequested=false;store.set('users',us);state.tempPw={name:u.name,pw};render()});break}
    case 'closetemp':state.tempPw=null;render();break;
    case 'lockuser':{if(!isAdmin())break;const us=users(),u=us.find(x=>x.id===id);u.locked=!u.locked;store.set('users',us);render();break}
    case 'deluser':{if(!isAdmin()||!twice(el,'Bấm lại để xóa'))break;
      store.set('users',users().filter(x=>x.id!==id));
      const p=progressAll();delete p[id];store.set('progress',p);
      store.set('projects',projects().filter(x=>x.uid!==id));
      toast('Đã xóa tài khoản và dữ liệu');render();break}
    case 'approve':{if(!isAdmin())break;const ps=projects(),p=ps.find(x=>x.id===id);p.approved=!p.approved;store.set('projects',ps);render();break}
  }
}
function onInput(e){
  const t=e.target;
  if(t.id==='flt_q'){state.filter.q=t.value;updateList()}
  else if(t.id==='chatIn'){state.chat.draft=t.value;growBox()}
  else if(t.id==='dq'){state.dict.q=t.value;const l=$('#dlist');if(l)l.innerHTML=dictList()}
  else if(t.id==='dfavonly'){state.dict.fav=t.checked;const l=$('#dlist');if(l)l.innerHTML=dictList()}
  else if(t.id==='qsearch'){state.qa.q=t.value;render();const e=$('#qsearch');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
  else if(t.id==='shareProg'){const us=users(),x=us.find(a=>a.id===(me()||{}).id);if(x){x.share=t.checked;store.set('users',us);syncProfile();toast(t.checked?'Bạn bè đã xem được tiến độ của bạn':'Đã ẩn tiến độ khỏi bạn bè')}}
  else if(t.id==='csearch'){state.chat.q=t.value;refreshList()}
  else if(t.id==='hintMode'){state.chat.hint=t.checked}
  else if(t.id==='renIn'){const cv=state.chat.convs.find(x=>x.id===t.dataset.id);if(cv&&t.value.trim())cv.title=t.value.trim().slice(0,60);state.chat.ren=null;saveChat();refreshList()}
  else if(t.id==='pickLesson'&&t.value){const l=lessonsAll().find(x=>x.id===t.value);if(l){state.chat.ctx=l.id;state.chat.draft=`Mình đang làm bài “${l.title}”. Đề bài: ${l.prompt}\nMình bị kẹt ở bước: `;render();const b=$('#chatIn');if(b){growBox();b.focus();b.setSelectionRange(b.value.length,b.value.length)}}}
  else if(t.id==='r_pw'){
    const v=t.value;let s=0;if(v.length>=8)s++;if(/[A-Za-z]/.test(v)&&/\d/.test(v))s++;if(v.length>=12||/[^A-Za-z0-9]/.test(v))s++;
    const m=$('#r_meter');if(m){m.style.width=(v?(s+1)*25:0)+'%';m.style.background=s<=1?'var(--red)':s===2?'var(--amber)':'var(--green)'}
  }
}
document.addEventListener('focusout',e=>{if(e.target.id==='renIn'&&state.chat.ren){state.chat.ren=null;refreshList()}});
function onKey(e){
  if(e.target.id==='renIn'&&e.key==='Enter'){e.preventDefault();e.target.blur();return}
  if(e.target.id==='chatIn'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendChat()}
}

document.addEventListener('click',onClick);
document.addEventListener('submit',onSubmit);
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);
document.addEventListener('keydown',onKey);

/* ---------- boot ---------- */
initAI();
initCM();
seed().then(()=>{
  const r=parseHash();if(r)state.route=r;
  render();
});
})();
</script>
